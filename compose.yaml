services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: pennypilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
      POSTGRES_DB: pennypilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pennypilot_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pennypilot -d pennypilot"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pennypilot_data:
